<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#0D0B14"/>
      <stop offset="100%" stop-color="#140A22"/>
    </linearGradient>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1A1A24" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1A1A24" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.7"/>

  <!-- Circuit Lines -->
  <path d="M 0 320 L 220 320 L 320 220 L 520 220 L 600 140 L 800 140" stroke="#39FF14" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 0 360 L 240 360 L 360 240 L 580 240 L 640 180 L 800 180" stroke="#FF007F" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Neon Tunnel Hexagon -->
  <polygon points="400,60 560,150 560,300 400,390 240,300 240,150" fill="none" stroke="#8A2BE2" stroke-width="4" opacity="0.8"/>
  <polygon points="400,100 520,170 520,280 400,350 280,280 280,170" fill="none" stroke="#39FF14" stroke-width="3" filter="url(#glow)"/>
  <polygon points="400,140 480,190 480,260 400,310 320,260 320,190" fill="none" stroke="#00FFFF" stroke-width="2"/>

  <!-- Technical Overlay Typography -->
  <text x="40" y="70" font-family="'Space Grotesk', 'Orbitron', monospace" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="4">NEON CIRCUIT // VOL.07</text>
  <text x="40" y="105" font-family="'JetBrains Mono', monospace" font-size="14" fill="#39FF14" font-weight="700" letter-spacing="2">// LIVE HARD TECHNO &amp; PSY TRANCE GATHERING</text>
  <text x="40" y="130" font-family="'JetBrains Mono', monospace" font-size="12" fill="#B0B0B0">DATE: 31.OCT.2026 // TIME: 20:00 - 08:00 // POWER: 140 kW AUDIO</text>

  <!-- Technical Marks -->
  <rect x="700" y="40" width="60" height="24" fill="#39FF14"/>
  <text x="708" y="57" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#000000">DISP</text>
  <line x1="40" y1="400" x2="160" y2="400" stroke="#39FF14" stroke-width="4"/>
  <text x="40" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#666666">SEC.01 // MAIN WAREHOUSE // GUATEMALA</text>
</svg>
